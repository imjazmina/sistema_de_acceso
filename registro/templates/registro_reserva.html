<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamiento de Visita</title>
    <style src="registro.css"></style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js" integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK" crossorigin="anonymous"></script>
    <title>Agendamiento de Visita</title>
    <style>
      body {
        background-color: #ccc;
      }
     .container{
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        max-width: 45%;
        margin: 80px auto;
      }
    </style>
  </head>
  <body>
    <!-- Bootstrap Toast Container Back-->
  <div aria-live="polite" aria-atomic="true" class="position-relative">
    <div class="toast-container position-fixed top-0 end-0 p-3">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="toast align-items-center text-white bg-{{ category }} border-0" role="alert" aria-live="assertive" aria-atomic="true">
              <div class="d-flex">
                <div class="toast-body">
                  {{ message }}
                </div>
                <button type="button" class="btn-close btn-close-white m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
              </div>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
    </div>
  </div>
    <!-- Bootstrap Toast Container Front-->
  <div class="toast-container position-fixed top-0 end-0 p-2 " id="toast-container"></div>
  <!--Form-->
   <div class="container">
      <form method="post" action="{{ url_for('paso1') }}" enctype="multipart/form-data" autocomplete="off" class="col-12">
        <h2 class="mb-4">AGENDAMIENTO DE ACCESO A LA SALA DE SERVIDORES</h2>

        <div class="mb-3">
            <label for="name" class="form-label">Cliente</label><!--Nombre cliente-->
            <select value="" id="cliente" class="form-control" name="cliente" required><!--traer de la tabla cliente los registros-->
                <option value="" disabled selected>Seleccione una opción</option>
                <option value="opcion1">opcion1</option>
                <option value="opcion2">opcion2</option>
                <option value="opcion3">opcion3</option>
            </select>
        </div>

        <div class="mb-3">
          <label for="fecha" class="form-label">Fecha</label>
          <input type="date" class="form-control" id="fecha" name="fecha" required>
        </div>

        <div class="mb-3">
          <label for="hora_entrada" class="form-label">Hora entrada</label>
          <input type="time" class="form-control" id="hora_entrada" name="hora_entrada" required>
        </div>

        <div class="mb-3">
          <label for="hora_salida" class="form-label">Hora salida</label>
          <input type="time" class="form-control" id="hora_salida" name="hora_salida" required>
        </div>
        
        <div class="mb-3">
          <label for="motivo" class="form-label">Motivo</label>
          <input type="text" class="form-control" id="motivo" name="motivo" required >
        </div>

        <div class="mb-3">
            <label for="autorizante" class="form-label">Autorizante</label><!--Nombre autorizante-->
            <select id="autorizante" class="form-control" name="autorizante" required ><!--traer de la tabla autorizante los registros-->
                <option value="" disabled selected>Seleccione una opción</option>
                <option value="opcion1">opcion1</option>
                <option value="opcion2">opcion2</option>
                <option value="opcion3">opcion3</option>
            </select>
        </div>

        <a href="{{ url_for('agendar_visita') }}" class="text-decoration-none btn btn-outline-dark col-md-4" id="guardarVisita">Guardar Visita</a>

      </div>
      </form>
  </div>
  <script src="{{ url_for('static', filename='js/form_visita.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
</body>
</html>
